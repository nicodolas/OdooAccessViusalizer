name: Module quality

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Check JavaScript
        shell: bash
        run: |
          for file in static/src/js/*.js; do node --check "$file"; done
      - name: Check XML
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          for path in Path(".").rglob("*.xml"):
              ElementTree.parse(path)
          print("XML syntax OK")
          PY

  odoo-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U odoo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          path: addon
      - name: Checkout Odoo 19
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: "19.0"
          path: odoo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native Odoo dependencies
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev
      - name: Install Odoo dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r odoo/requirements.txt
      - name: Run Odoo module tests
        working-directory: odoo
        run: |
          python odoo-bin \
            --db_host=127.0.0.1 --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            -d oav_ci --without-demo=all \
            --addons-path="$GITHUB_WORKSPACE/odoo/addons,$GITHUB_WORKSPACE/addon" \
            --init=base,odoo_access_visualizer \
            --test-enable --stop-after-init --log-level=test
